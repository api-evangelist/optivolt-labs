name: Optivolt Labs
description: >-
  Optivolt Labs (operating as Optivolt) is a Burlingame, California solar technology
  company building intelligent home solar systems with power electronics embedded
  directly inside each panel. Its patented Balancer device shuffles power from stronger
  to weaker zones within a panel to keep energy flowing in shaded and non-ideal
  conditions, delivering up to 50% more annual energy and improved shaded performance
  versus conventional panels. The product line includes 450W N-type mono half-cut
  panels, universal battery and inverter compatibility, and a real-time monitoring
  app for tracking energy and savings. Optivolt is a Techstars-backed hardware
  company; it does not currently publish a public developer API, SDK, or developer portal.
